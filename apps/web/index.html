<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiwuAI Connect — AI Social Media Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              liwuai: { 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' },
              indigo: { 500: '#6366f1', 600: '#4f46e5' },
              purple: { 500: '#a855f7', 600: '#9333ea' },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Geist Mono', 'monospace'],
            },
          },
        },
      };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap');
      body { font-family: 'Inter', sans-serif; }
      .mesh-gradient {
        background: radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0, transparent 50%),
          radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.15) 0, transparent 50%),
          radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0, transparent 50%);
      }
      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
